name: CI

on:
    push:
        branches: [master]
    pull_request:
    workflow_call:

env:
    CARGO_TERM_COLOR: always
    RUSTFLAGS: -D warnings
    RUSTDOCFLAGS: -D warnings

jobs:
    check:
        name: ${{ matrix.os }} / ${{ matrix.features.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                features:
                    - { name: tokio, args: "" }
                    - {
                          name: smol,
                          args: "--no-default-features --features smol",
                      }
                    - { name: tokio+smol, args: "--features smol" }
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy
            - uses: Swatinem/rust-cache@v2
            - name: Install Linux libraries for eframe
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
                    libxkbcommon-dev libssl-dev
            - run: cargo clippy --all-targets --locked ${{ matrix.features.args }}
            # Doc tests use tokio, they run in the docs job
            - run: cargo test --all-targets --locked ${{ matrix.features.args }}

    lib-without-runtime:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - run: cargo check --lib --locked --no-default-features

    fmt-and-docs:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt
            - uses: Swatinem/rust-cache@v2
            - run: cargo fmt --check
            - name: Install Linux libraries for eframe
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
                    libxkbcommon-dev libssl-dev
            - run: cargo doc --no-deps --locked --features smol
            - run: cargo test --doc --locked
