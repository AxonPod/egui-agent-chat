[package]
name = "egui-agent-chat"
version = "0.5.0"
edition = "2024"
description = "An egui chat widget for agentai agents: streamed answers, reasoning and tool calls"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AxonPod/egui-agent-chat"
readme = "README.md"
keywords = ["egui", "agent", "llm", "chat", "agentai"]
categories = ["gui"]
# Repository-only files; the screenshot is shown from GitHub
exclude = ["docs/", ".github/", ".zed/", "CLAUDE.md"]

[features]
default = ["tokio"]
## `Driver`, which runs the agent for a panel's actions, and the `Spawn` trait it starts turns
## with.
driver = ["dep:futures-util"]
## Implements `Spawn` for `tokio::runtime::Handle`.
tokio = ["driver", "dep:tokio"]
## Implements `Spawn` for smol's global executor and for `Arc<smol::Executor>`. Tasks run
## through async-compat, which gives agentai's tokio-based HTTP client its reactor.
smol = ["driver", "dep:smol", "dep:async-compat"]

[dependencies]
agentai = { version = "0.6", default-features = false }
async-compat = { version = "0.2.6", optional = true }
base64 = "0.23.1"
egui = "0.37"
egui_commonmark = { version = "0.26", features = [
    "better_syntax_highlighting",
] }
futures-util = { version = "0.3.34", optional = true }
serde_json = "1.0.154"
smol = { version = "2", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

[dev-dependencies]
# The tests' #[toolbox], the example's date and time tool, and TLS for the example and the
# live tests (the library leaves the TLS backend to the app)
agentai = { version = "0.6", default-features = false, features = [
    "macros",
    "tools-buildin",
    "rustls-ring",
    "system-proxy",
] }
anyhow = "1.0.104"
async-trait = "0.1.92"
dotenvy = "0.15.7"
eframe = "0.37"
egui_extras = { version = "0.37", features = ["all_loaders"] }
egui_kittest = "0.37"
# A tool waits for the user's answer in the tests and the example, on any runtime
futures-channel = "0.3.34"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
] }
rfd = "0.17"
schemars = "1.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[[test]]
name = "agent"
required-features = ["tokio"]

[[test]]
name = "turns"
required-features = ["tokio"]

[[example]]
name = "headless"
required-features = ["tokio"]

[[example]]
name = "two_panels"
required-features = ["tokio"]

[target.'cfg(target_os = "macos")'.dev-dependencies]
muda = "0.21"
